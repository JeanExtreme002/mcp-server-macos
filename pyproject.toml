[project]
name = "mcp-server-macos"
dynamic = ["version"]
description = "An MCP server for automating and controlling macOS."
authors = [
    { name = "Jean Loui Bernard Silva de Jesus", email = "contact@jeanloui.dev" },
]
maintainers = [
    { name = "Jean Loui Bernard Silva de Jesus", email = "contact@jeanloui.dev" },
]
license = "MIT"
license-files = ["LICENSE*"]
readme = "README.md"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "macos",
    "mac",
    "osx",
    "automation",
    "desktop-automation",
    "pymacos",
    "claude",
    "llm",
    "ai-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# 3.10 is the oldest Python the MCP SDK runs on (pymacos itself goes back to 3.9).
requires-python = ">=3.10"
# Both follow Semantic Versioning, so the next major release of either is held back until the server is
# checked against it. pydantic comes with mcp, at the version mcp needs: it's used here only through it.
dependencies = [
    "mcp>=2.3,<3",
    "pymacos>=1.39,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures",
    "flake8",
    "mypy",
    "build",
    "twine",
]

[project.scripts]
mcp-server-macos = "mcp_server_macos.server:main"

[project.urls]
Homepage = "https://github.com/JeanExtreme002/mcp-server-macos"
Source = "https://github.com/JeanExtreme002/mcp-server-macos"
Issues = "https://github.com/JeanExtreme002/mcp-server-macos/issues"
Funding = "https://github.com/sponsors/JeanExtreme002"

[tool.mypy]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# -rs: the live tests skip themselves outside macOS, or when macOS refuses; listing them tells a full
# run from a green one with gaps.
addopts = "-rs"
xfail_strict = true
markers = [
    "live: talks to the real system (macOS only); what the tools do really happens on this Mac",
]

[tool.coverage.run]
source = ["mcp_server_macos"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.hatch.version]
path = "mcp_server_macos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server_macos"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/codecov.yml", "/Makefile"]

# hatchling>=1.27 is required for the PEP 639 ``license``/``license-files`` metadata.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
