name: Publish to PyPI and the MCP Registry

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The distributions are built once, here, and what reaches PyPI is exactly
  # what was checked and tested: never a second build of the same commit.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        fetch-depth: 0  # the whole history, to tell whether the tag is on main
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: '3.12'
    # Releases are made from main: a tag on a branch never merged would use up
    # its version on PyPI, for good, with code main never had.
    - name: Check the tag is on main
      run: |
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
          echo "::error::Release tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
          exit 1
        fi
    # A PyPI version can never be uploaded twice, so refuse to publish when the
    # release tag and the package version disagree (e.g. tag v0.2.0 while
    # mcp_server_macos/__init__.py still says 0.1.0).
    - name: Check the tag matches the package version
      run: |
        version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('mcp_server_macos/__init__.py').read()).group(1))")
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::Release tag $GITHUB_REF_NAME does not match __version__ $version"
          exit 1
        fi
    - name: Install build tools
      run: python -m pip install --upgrade pip build twine
    - name: Build the sdist, and the wheel from it
      run: python -m build
    - name: Check the metadata PyPI reads
      run: twine check --strict dist/*
    - name: Check what the wheel holds
      run: python .github/wheel_check.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: dist
        path: dist/

  # The whole suite, live tests included, against the wheel just built,
  # installed with the source folder gone: nothing reaches PyPI from a build
  # whose tests fail.
  test:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
      with:
        name: dist
        path: dist/
    - name: Install the wheel in a clean environment
      run: |
        python -m venv /tmp/env
        /tmp/env/bin/python -m pip install --upgrade pip pytest pytest-rerunfailures
        /tmp/env/bin/python -m pip install dist/*.whl
        rm -rf mcp_server_macos
    - name: Check it's the installed package that's imported, and that its command runs
      run: |
        /tmp/env/bin/python -c "import mcp_server_macos as m, sys; print(m.__version__, m.__file__); sys.exit('site-packages' not in m.__file__)"
        /tmp/env/bin/mcp-server-macos --version
    - name: Unit tests
      run: /tmp/env/bin/python -m pytest tests/unit -v
    - name: Live tests
      # Retried once, as on pull requests: the runner is shared. The unit tests never are.
      run: /tmp/env/bin/python -m pytest tests/live -v -rsR --reruns 1 --reruns-delay 5

  # The publish action only runs on Linux, hence a separate job. It uploads the
  # artifact the jobs above checked and tested, untouched.
  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  # The MCP Registry lists the server for MCP clients to find. It checks the package on PyPI (the
  # mcp-name marker in the README, the version server.json names), so this runs only once the upload
  # above succeeded. It reads server.json from the checkout and the package from PyPI itself, so it
  # needs no artifact from the build.
  #
  # If it fails after the upload (PyPI slow to serve the release, the registry down), re-run this job
  # alone: the package is on PyPI already, and the publish job can't upload it twice.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # mcp-publisher logs in with the workflow's OIDC token
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    # tests/unit/test_server_json.py holds server.json to __version__, and the build job holds
    # __version__ to the tag: this is the same check on what is about to be published.
    - name: Check the release matches server.json
      run: |
        listed=$(jq -r .version server.json)
        if [ "v$listed" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Release tag $GITHUB_REF_NAME does not match the version of server.json, $listed"
          exit 1
        fi
        echo "VERSION=$listed" >> "$GITHUB_ENV"
    - name: Wait for PyPI to serve the release
      # PyPI's JSON API can lag the upload by a few minutes.
      run: |
        for _ in $(seq 1 30); do
          if curl -fsS "https://pypi.org/pypi/mcp-server-macos/$VERSION/json" \
              | jq -e --arg name "$(jq -r .name server.json)" \
                  '.info.description | contains("mcp-name: " + $name)' > /dev/null; then
            exit 0
          fi
          sleep 20
        done
        echo "::error::PyPI does not serve $VERSION with the mcp-name marker yet"
        exit 1
    - name: Install mcp-publisher
      # The checksum is the one of registry_1.8.9_checksums.txt, on the same release page. To move to
      # a newer release, change the version in the URL and paste the matching line of its checksums file.
      run: |
        curl -fsSLo mcp-publisher.tar.gz \
          "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz"
        echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf mcp-publisher.tar.gz mcp-publisher
    - name: Publish to the MCP Registry
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish

  # The bundle Claude Desktop installs in one click (mcp-server-macos.mcpb), attached to the release.
  # It holds no code of the server: it installs this version from PyPI, so it's built once the upload
  # above succeeded. The README links to the latest release's. If it fails, re-run this job alone.
  bundle:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # to attach the bundle to the release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: '3.12'
    # The script reads the tools from the package, so it's installed; Node, for the mcpb command, is
    # on the runner already.
    - name: Install the package
      run: python -m pip install .
    - name: Build the bundle
      run: python scripts/build_mcpb.py
    - name: Attach it to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" dist/mcp-server-macos.mcpb --clobber
