name: Test

# The test suite, on macOS across Python versions, on Linux, and against the oldest versions of the
# dependencies the package says it works with.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, with nothing pushed: the server sits on the MCP SDK and pymacos, which sits on macOS, and
  # all three move. Nothing pins them inside the ranges of pyproject.toml, so a failure here is a new
  # release of one of them that broke main, found before a user does.
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

concurrency:
  # The event too: the weekly run on main and a push to main don't cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The live tests call the tools against the real system, so the Python-version sweep runs on macOS.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Unit tests
      # --cov-fail-under is the real coverage gate: deterministic and independent of any external
      # service. Codecov (below) only reports. Keep it in step with COVERAGE_MIN in the Makefile.
      run: pytest tests/unit -v --cov=mcp_server_macos --cov-report=term --cov-report=xml --cov-fail-under=90
    - name: Live tests
      # They talk to a real, shared runner: a failure is retried before it counts, and -rR lists the
      # tests that needed the retry, so a flaky one shows. A test that macOS refuses (notifications
      # turned off) skips itself, and -rs lists it.
      run: >-
        pytest tests/live -v -rsR --reruns 1 --reruns-delay 5
        --cov=mcp_server_macos --cov-append --cov-report=term --cov-report=xml
    - name: Upload coverage to Codecov
      # Informational only (see codecov.yml): a flaky upload never fails the job. Runs even when
      # tests fail, so partial coverage stays visible.
      if: always()
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
      with:
        files: ./coverage.xml
        flags: macOS-py${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # The oldest mcp and pymacos that pyproject.toml accepts, on the oldest Python: the other jobs
  # install the newest ones, so a lower bound that no longer works would only fail for users.
  test-oldest-dependencies:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: '3.12'
    - name: Read the lower bounds from pyproject.toml
      # Each dependency is written "name>=low,<next major": anything else fails here, to be handled.
      run: |
        python - <<'EOF' > oldest.txt
        import re, tomllib

        for dependency in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]:
            name, low = re.fullmatch(r"([A-Za-z0-9_.-]+)>=([0-9.]+),<[0-9]+", dependency).groups()
            print("{}=={}".format(name, low))
        EOF
        cat oldest.txt
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" -c oldest.txt
        pip list
    - name: Unit tests
      run: pytest tests/unit -v
    - name: Live tests
      run: pytest tests/live -v -rsR --reruns 1 --reruns-delay 5

  # The server must start anywhere and say, tool by tool, that it needs macOS, so the unit tests also
  # run on Linux (the live ones skip themselves there).
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test with pytest
      run: pytest tests -v --cov=mcp_server_macos --cov-report=term --cov-report=xml
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
      with:
        files: ./coverage.xml
        flags: Linux-py3.12
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
